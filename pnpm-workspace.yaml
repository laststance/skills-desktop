packages:
  - apps/*
  - packages/*

# Single source of truth for dependencies shared by more than one workspace
# package. Reference them as `catalog:`; sherif fails CI on version drift.
catalogMode: strict
catalog:
  '@typescript/native': npm:typescript@7.0.2
  '@eslint/js': ^10.0.1
  '@orpc/client': 1.16.0
  '@orpc/contract': 1.16.0
  '@orpc/server': 1.16.0
  '@orpc/tanstack-query': 1.16.0
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/browser-playwright': ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  eslint: ^10.13.0
  eslint-plugin-react-hooks: ^7.1.1
  lucide-react: ^1.61.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  # Keep the TypeScript 6 JS API at the `typescript` import for ESLint and other tools.
  # @typescript/native provides TypeScript 7's `tsc` binary without a bin conflict.
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: ^8.72.0
  vitest: ^5.0.5
  zod: 4.6.7

# The TypeScript 6 compatibility wrapper reports package version 6.0.2 while
# its JS API and `tsc6` binary are 6.0.3.
peerDependencyRules:
  allowedVersions:
    '@laststance/react-next-eslint-plugin>typescript': 6.0.2
    'eslint-config-ts-prefixer>typescript': 6.0.2

allowBuilds:
  # Click-to-source does not use Code Inspector's optional terminal probe.
  '@code-inspector/core': false
  electron: true
  electron-winstaller: false
  esbuild: true
  fallow: false
  # Keep the unused native PTY compiler blocked from install-time execution.
  node-pty: false
  sharp: true
  unrs-resolver: true

# Install both macOS native image backends while preserving the current CI platform.
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - arm64
    - x64

# Dependabot cannot lift these vulnerable build-tool transitives until their parent packages update.
overrides:
  '@electron/get@5>undici': 7.29.1
  'ajv@8>fast-uri': 3.1.8
  # Fallow's optional type-aware sidecar pins TypeScript 7; this repo uses its Rust-native gates and keeps TypeScript 6.
  'fallow>fallow-type-aware': '-'
  http-cache-semantics: 4.3.0
  js-yaml: 4.3.2
  'minimatch@10>brace-expansion': 5.0.12
  'minimatch@3>brace-expansion': 1.1.21
  'minimatch@5>brace-expansion': 2.1.7
  'minimatch@9>brace-expansion': 2.1.7
  'node-gyp@12>undici': 6.28.1
  tar: 7.5.21
  'vite@8>postcss': 8.5.23

# Supply-chain security (migrated from .npmrc 2026-04-22)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
  # Allow only the exact versions validated in the 2026-09-05 dependency refresh.
  - '@playwright/test@1.63.0'
  - browserslist@4.28.9
  - eslint-plugin-browser-security@2.1.5
  - lint-staged@17.5.0
  - lucide-react@1.41.0 || 1.50.0
  - playwright-core@1.63.0
  - playwright@1.63.0
  - tinyspy@4.0.6
  # Keep the cooldown for future versions while allowing this 2026-09-17 refresh.
  - '@rolldown/binding-android-arm-eabi@1.2.9'
  - '@rolldown/binding-android-arm64@1.2.9'
  - '@rolldown/binding-darwin-arm64@1.2.9'
  - '@rolldown/binding-darwin-x64@1.2.9'
  - '@rolldown/binding-freebsd-x64@1.2.9'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.9'
  - '@rolldown/binding-linux-arm64-gnu@1.2.9'
  - '@rolldown/binding-linux-arm64-musl@1.2.9'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.9'
  - '@rolldown/binding-linux-s390x-gnu@1.2.9'
  - '@rolldown/binding-linux-x64-gnu@1.2.9'
  - '@rolldown/binding-linux-x64-musl@1.2.9'
  - '@rolldown/binding-openharmony-arm64@1.2.9'
  - '@rolldown/binding-win32-arm64-msvc@1.2.9'
  - '@rolldown/binding-win32-x64-msvc@1.2.9'
  - react-draggable@4.7.2
  - rolldown@1.2.9
  # Keep future releases on cooldown; exact versions selected by the 2026-09-26 and 2026-10-15 refreshes.
  - '@tanstack/query-core@5.104.0 || 5.104.1 || 5.104.3'
  # Allow the exact newest releases selected by the 2026-10-02 upgrade.
  - '@types/node@24.19.1 || 26.6.4'
  - baseline-browser-mapping@2.11.27
  - electron-to-chromium@1.5.444
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - '@orpc/client@1.15.7'
  - '@orpc/contract@1.15.7'
  - '@orpc/interop@1.15.7'
  - '@orpc/server@1.15.7'
  - '@orpc/shared@1.15.7'
  - '@orpc/standard-server-aws-lambda@1.15.7'
  - '@orpc/standard-server-fastify@1.15.7'
  - '@orpc/standard-server-fetch@1.15.7'
