packages:
  - apps/*
  - packages/*

# Single source of truth for dependencies shared by more than one workspace
# package. Reference them as `catalog:`; sherif fails CI on version drift.
catalogMode: strict
catalog:
  '@eslint/js': ^10.0.1
  '@orpc/client': 1.15.4
  '@orpc/contract': 1.15.4
  '@orpc/server': 1.15.4
  '@orpc/tanstack-query': 1.15.4
  '@types/node': ^26.6.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/browser-playwright': ^5.0.2
  '@vitest/coverage-v8': ^5.0.2
  eslint: ^10.11.0
  eslint-plugin-react-hooks: ^7.1.1
  lucide-react: ^1.48.0
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  typescript: 6.0.3
  typescript-eslint: ^8.70.1
  vitest: ^5.0.2
  zod: 4.6.5

allowBuilds:
  # Click-to-source does not use Code Inspector's optional terminal probe.
  '@code-inspector/core': false
  electron: true
  electron-winstaller: false
  esbuild: true
  fallow: false
  # Keep the unused native PTY compiler blocked from install-time execution.
  node-pty: false
  sharp: true
  unrs-resolver: true

# Install both macOS native image backends while preserving the current CI platform.
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - arm64
    - x64

# Dependabot cannot lift these vulnerable build-tool transitives until their parent packages update.
overrides:
  '@electron/get@5>undici': 7.29.0
  'ajv@8>fast-uri': 3.1.5
  # Fallow's optional type-aware sidecar pins TypeScript 7; this repo uses its Rust-native gates and keeps TypeScript 6.
  'fallow>fallow-type-aware': '-'
  js-yaml: 4.3.2
  'minimatch@10>brace-expansion': 5.0.9
  'minimatch@3>brace-expansion': 1.1.18
  'minimatch@5>brace-expansion': 2.1.4
  'minimatch@9>brace-expansion': 2.1.4
  'node-gyp@12>undici': 6.28.0
  tar: 7.5.21
  'vite@8>postcss': 8.5.23

# Supply-chain security (migrated from .npmrc 2026-04-22)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
  # Allow only the exact versions validated in the 2026-09-05 dependency refresh.
  - '@playwright/test@1.63.0'
  - browserslist@4.28.9
  - eslint-plugin-browser-security@2.1.5
  - lint-staged@17.5.0
  - lucide-react@1.41.0
  - playwright-core@1.63.0
  - playwright@1.63.0
  - tinyspy@4.0.6
  # Keep the cooldown for future versions while allowing this 2026-09-17 refresh.
  - '@rolldown/binding-android-arm-eabi@1.2.9'
  - '@rolldown/binding-android-arm64@1.2.9'
  - '@rolldown/binding-darwin-arm64@1.2.9'
  - '@rolldown/binding-darwin-x64@1.2.9'
  - '@rolldown/binding-freebsd-x64@1.2.9'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.9'
  - '@rolldown/binding-linux-arm64-gnu@1.2.9'
  - '@rolldown/binding-linux-arm64-musl@1.2.9'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.9'
  - '@rolldown/binding-linux-s390x-gnu@1.2.9'
  - '@rolldown/binding-linux-x64-gnu@1.2.9'
  - '@rolldown/binding-linux-x64-musl@1.2.9'
  - '@rolldown/binding-openharmony-arm64@1.2.9'
  - '@rolldown/binding-win32-arm64-msvc@1.2.9'
  - '@rolldown/binding-win32-x64-msvc@1.2.9'
  - react-draggable@4.7.2
  - rolldown@1.2.9
  # Keep the cooldown for future versions while allowing this 2026-09-26 refresh.
  - '@tanstack/query-core@5.104.0'
