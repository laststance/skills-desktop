packages:
  - apps/*
  - packages/*

# Single source of truth for dependencies shared by more than one workspace
# package. Reference them as `catalog:`; sherif fails CI on version drift.
catalogMode: strict
catalog:
  '@typescript/native': npm:typescript@7.0.2
  '@eslint/js': ^10.0.1
  '@orpc/client': 1.16.2
  '@orpc/contract': 1.16.2
  '@orpc/server': 1.16.2
  '@orpc/tanstack-query': 1.16.2
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/browser-playwright': ^5.1.0
  '@vitest/coverage-v8': ^5.1.0
  eslint: ^10.15.0
  eslint-plugin-react-hooks: ^7.1.1
  lucide-react: ^1.73.0
  prettier: ^3.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  # Keep the TypeScript 6 JS API at the `typescript` import for ESLint and other tools.
  # @typescript/native provides TypeScript 7's `tsc` binary without a bin conflict.
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: ^8.72.2
  vitest: ^5.1.0
  zod: 4.6.7
  '@pierre/trees': 1.0.0
  fallow: 3.43.1
  husky: ^9.1.7
  lint-staged: ^17.6.1
  npm-run-all2: ^9.0.4
  sherif: 1.13.0
  '@babel/core': ^8.1.2
  '@electron/notarize': ^3.1.2
  '@laststance/react-next-eslint-plugin': ^2.4.0
  '@playwright/test': ^1.65.1
  '@rolldown/plugin-babel': ^0.3.1
  '@storybook/addon-a11y': 10.6.7
  '@storybook/addon-docs': 10.6.7
  '@storybook/react-vite': 10.6.7
  '@tailwindcss/vite': ^4.3.5
  '@types/culori': ^4.0.1
  '@vitejs/plugin-react': ^6.3.0
  babel-plugin-react-compiler: ^1.0.0
  code-inspector-plugin: ~2.0.9
  culori: ^4.0.2
  electron: ^45.3.3
  electron-builder: ^26.18.0
  electron-devtools-installer: ^4.0.0
  electron-vite: ^6.0.0
  eslint-config-ts-prefixer: ^5.1.0
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-import-x: 4.18.1
  eslint-plugin-react-you-might-not-need-an-effect: ^1.2.0
  happy-dom: ^21.0.4
  playwright: ^1.65.1
  storybook: 10.6.7
  vite: ^8.3.8
  vitest-browser-react: ^2.3.0
  '@laststance/redux-storage-middleware': 0.5.1
  '@radix-ui/react-checkbox': ^1.4.1
  '@radix-ui/react-dialog': ^1.3.1
  '@radix-ui/react-dropdown-menu': ^2.2.1
  '@radix-ui/react-scroll-area': ^1.4.0
  '@radix-ui/react-separator': ^1.2.0
  '@radix-ui/react-slot': ^1.5.0
  '@radix-ui/react-tabs': ^1.2.1
  '@radix-ui/react-toggle-group': ^1.2.1
  '@radix-ui/react-tooltip': ^1.4.1
  '@reduxjs/toolkit': ^2.14.0
  '@tanstack/react-query': ^5.108.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  electron-updater: ^6.8.11
  react-easy-crop: ^6.2.5
  react-grid-layout: ^2.3.0
  react-markdown: ^10.1.0
  react-redux: ^9.3.1
  react-resizable-panels: ^4.24.0
  react-window: ^2.5.3
  remark-gfm: ^4.0.1
  sharp: ^0.35.5
  shiki: ^4.6.0
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  ts-pattern: ^5.9.2
  '@next/eslint-plugin-next': ^16.4.6
  '@tailwindcss/postcss': ^4.3.5
  postcss: ^8.5.33
  '@vercel/analytics': ^2.0.1
  next: ^16.4.6

# The TypeScript 6 compatibility wrapper reports package version 6.0.2 while
# its JS API and `tsc6` binary are 6.0.3.
peerDependencyRules:
  allowedVersions:
    '@laststance/react-next-eslint-plugin>typescript': 6.0.2
    'eslint-config-ts-prefixer>typescript': 6.0.2

allowBuilds:
  # Click-to-source does not use Code Inspector's optional terminal probe.
  '@code-inspector/core': false
  electron: true
  electron-winstaller: false
  esbuild: true
  fallow: false
  # Keep the unused native PTY compiler blocked from install-time execution.
  node-pty: false
  sharp: true
  unrs-resolver: true

# Install both macOS native image backends while preserving the current CI platform.
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - arm64
    - x64

# Dependabot cannot lift these vulnerable build-tool transitives until their parent packages update.
overrides:
  '@electron/get@5>undici': 7.29.1
  'ajv@8>fast-uri': 3.1.8
  # Fallow's optional type-aware sidecar pins TypeScript 7; this repo uses its Rust-native gates and keeps TypeScript 6.
  'fallow>fallow-type-aware': '-'
  http-cache-semantics: 4.3.0
  js-yaml: 4.3.2
  'minimatch@10>brace-expansion': 5.0.12
  'minimatch@3>brace-expansion': 1.1.21
  'minimatch@5>brace-expansion': 2.1.7
  'minimatch@9>brace-expansion': 2.1.7
  'node-gyp@12>undici': 6.28.1
  tar: 7.5.21
  'vite@8>postcss': 8.5.23

# Supply-chain security (migrated from .npmrc 2026-04-22)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Matching core for the explicitly permitted React Query update.
  - '@tanstack/query-core@5.108.0'
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
  # Allow only the exact versions validated in the 2026-09-05 dependency refresh.
  - '@playwright/test@1.63.0'
  - browserslist@4.28.9
  - eslint-plugin-browser-security@2.1.5
  - lint-staged@17.5.0
  - lucide-react@1.41.0 || 1.50.0
  - playwright-core@1.63.0
  - playwright@1.63.0
  - tinyspy@4.0.6
  # Keep the cooldown for future versions while allowing this 2026-09-17 refresh.
  - '@rolldown/binding-android-arm-eabi@1.2.9'
