allowBuilds:
  # Click-to-source does not use Code Inspector's optional terminal probe.
  '@code-inspector/core': false
  electron: true
  electron-winstaller: false
  esbuild: true
  fallow: false
  # Keep the unused native PTY compiler blocked from install-time execution.
  node-pty: false
  sharp: true
  unrs-resolver: true

# Dependabot cannot lift these vulnerable build-tool transitives until their parent packages update.
overrides:
  '@electron/get@5>undici': 7.29.0
  'ajv@8>fast-uri': 3.1.5
  'minimatch@10>brace-expansion': 5.0.9
  'minimatch@3>brace-expansion': 1.1.18
  'minimatch@5>brace-expansion': 2.1.4
  'minimatch@9>brace-expansion': 2.1.4
  'node-gyp@12>undici': 6.28.0
  tar: 7.5.21
  'vite@8>postcss': 8.5.23

# Supply-chain security (migrated from .npmrc 2026-04-22)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
