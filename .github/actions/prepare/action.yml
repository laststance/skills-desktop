name: Prepare
description: Install the pinned pnpm release and all workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        install: false

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml

    # One frozen install covers apps/desktop, apps/website and packages/*.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
